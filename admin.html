<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Secure Admin</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #121212; color: #0f0; padding: 20px; }
        .box { background: #1e1e1e; padding: 20px; border-radius: 8px; max-width: 600px; margin: auto; border: 1px solid #333; }
        input { width: 95%; padding: 10px; margin: 10px 0; background: #000; border: 1px solid #444; color: #fff; }
        button { width: 100%; padding: 12px; background: #0056b3; color: #fff; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #004494; }
        #log { margin-top: 20px; height: 150px; overflow-y: scroll; border: 1px solid #333; background: #000; padding: 5px; font-size: 12px; }
    </style>
</head>
<body>

<div class="box">
    <h2>🔐 Ludo Secure Upload</h2>
    <label>GitHub PAT Token:</label>
    <input type="text" id="ghToken" placeholder="ghp_xxxxxxxxxxxxx">
    
    <label>Discord Bot Token (Will be Encoded):</label>
    <input type="text" id="dcToken" placeholder="Your Discord Token">
    
    <label>Channel ID:</label>
    <input type="text" id="channelId" placeholder="123456789">

    <button id="saveBtn">Encode & Upload to GitHub</button>
</div>

<div class="box">
    <h3>📝 Live Logs</h3>
    <div id="log"></div>
</div>

<script>
    // --- CUSTOM ENCODING LOGIC ---
    // Yeh function token ko encode karega taake GitHub scanner usse na samajh paye
    const ENCODE_KEY = "LUDO_SECURE_2026"; // Aap is key ko change kar sakte hain

    function encodeData(token) {
        let encoded = [];
        for (let i = 0; i < token.length; i++) {
            // XOR Logic: ASCII value of char ^ ASCII value of key char
            let charCode = token.charCodeAt(i);
            let keyCode = ENCODE_KEY.charCodeAt(i % ENCODE_KEY.length);
            let newCode = charCode ^ keyCode;
            // Convert to Hex string for storage (easier to handle)
            encoded.push(newCode.toString(16));
        }
        return encoded.join("-"); // Join with hyphens
    }

    function decodeData(encodedStr) {
        if (!encodedStr) return "";
        const parts = encodedStr.split("-");
        let decoded = "";
        for (let i = 0; i < parts.length; i++) {
            let val = parseInt(parts[i], 16); // Convert hex back to number
            let keyCode = ENCODE_KEY.charCodeAt(i % ENCODE_KEY.length);
            let originalChar = val ^ keyCode;
            decoded += String.fromCharCode(originalChar);
        }
        return decoded;
    }

    const logDiv = document.getElementById('log');
    function addLog(msg) {
        const div = document.createElement('div');
        div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        logDiv.prepend(div);
    }

    document.getElementById('saveBtn').addEventListener('click', async () => {
        const ghToken = document.getElementById('ghToken').value;
        const dcToken = document.getElementById('dcToken').value;
        const chId = document.getElementById('channelId').value;

        if(!ghToken || !dcToken) {
            addLog("❌ Tokens missing!");
            return;
        }

        // 1. Encode the Discord Token
        const encodedToken = encodeData(dcToken);
        const payload = {
            token: encodedToken,
            channel: chId,
            type: "ludo_config"
        };

        try {
            addLog("Fetching existing file SHA...");
            // Repo name assume kiya hai "ludo-backend", aap change kar sakte hain
            const repoOwner = "talibmalla455"; 
            const repoName = "ludo-backend";
            
            const res = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/config.json`, {
                headers: { 'Authorization': `token ${ghToken}` }
            });

            if (!res.ok && res.status !== 404) throw new Error("GitHub Fetch Error");

            let sha = null;
            if (res.status === 200) {
                const data = await res.json();
                sha = data.sha;
            }

            addLog("Encoding Payload...");
            // Convert payload to Base64 after custom encoding
            const b64Content = btoa(JSON.stringify(payload));

            addLog("Uploading to GitHub...");
            const res2 = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/config.json`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${ghToken}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: "Update config (Encoded)",
                    content: b64Content,
                    sha: sha
                })
            });

            if (res2.ok) {
                addLog("✅ Successfully Uploaded & Encoded!");
                // Test connection
                testDiscord(ghToken, chId);
            } else {
                const err = await res2.json();
                addLog(`❌ Upload Failed: ${err.message}`);
            }

        } catch (e) {
            addLog(`❌ Error: ${e.message}`);
        }
    });

    function testDiscord(token, chId) {
        fetch(`https://discord.com/api/v10/channels/${chId}`, {
            headers: { 'Authorization': `Bot ${token}` }
        })
        .then(res => res.ok ? addLog("✅ Discord Connection Verified!") : addLog("❌ Discord Invalid"))
        .catch(() => addLog("❌ Network Error"));
    }
</script>

</body>
</html>
