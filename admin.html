<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Config Manager</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: #fff; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #333; padding: 20px; border-radius: 10px; }
        label { display: block; margin-top: 10px; color: #aaa; }
        input { width: 100%; padding: 10px; margin-top: 5px; background: #222; border: 1px solid #555; color: #fff; }
        button { margin-top: 20px; width: 100%; padding: 15px; background: #007bff; border: none; color: white; font-size: 16px; cursor: pointer; }
        button:hover { background: #0056b3; }
        #status { margin-top: 10px; color: #4caf50; }
    </style>
</head>
<body>

<div class="container">
    <h2>Discord & GitHub Config</h2>
    
    <label>Discord Bot Token</label>
    <input type="text" id="discordToken" placeholder="Bot Token">
    
    <label>Discord Channel ID</label>
    <input type="text" id="channelId" placeholder="Channel ID">
    
    <label>GitHub PAT Token (For Auto-Commit)</label>
    <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">

    <button id="saveBtn">Save to GitHub</button>
    <div id="status"></div>
</div>

<script>
    // Configuration
    const REPO_OWNER = "YOUR_GITHUB_USERNAME"; // Apna GitHub username yahan likhein
    const REPO_NAME = "ludo-backend"; // Apni repository ka naam yahan likhein
    const FILE_PATH = "config.json";
    const BRANCH = "main"; // Ya "master" agar wo use ho

    // Load existing config
    window.onload = async () => {
        const status = document.getElementById('status');
        status.innerText = "Loading config from GitHub...";

        try {
            // Fetch current config from GitHub
            const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`);
            if (!response.ok) throw new Error("Could not load config. Make sure the file exists in the repo.");
            
            const data = await response.json();
            const content = atob(data.content); // Decode base64
            const config = JSON.parse(content);
            
            document.getElementById('discordToken').value = config.discordToken || '';
            document.getElementById('channelId').value = config.channelId || '';
            document.getElementById('ghToken').value = config.ghToken || '';
            status.innerText = "Config loaded successfully.";
        } catch (e) {
            status.innerText = "No config found yet. Enter details and save.";
        }
    };

    document.getElementById('saveBtn').addEventListener('click', async () => {
        const status = document.getElementById('status');
        const discordToken = document.getElementById('discordToken').value;
        const channelId = document.getElementById('channelId').value;
        const ghToken = document.getElementById('ghToken').value;

        if (!ghToken) {
            alert("Please enter GitHub PAT token!");
            return;
        }

        status.innerText = "Uploading to GitHub...";

        const config = {
            discordToken: discordToken,
            channelId: channelId,
            ghToken: ghToken
        };

        try {
            // Step 1: Get current file SHA and Content
            const configJsonStr = JSON.stringify(config, null, 2);
            const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                headers: {
                    'Authorization': `Bearer ${ghToken}`,
                    'Accept': 'application/vnd.github.v3+json'
                }
            });
            
            const data = await response.json();
            const sha = data.sha;

            // Step 2: Update the file
            const updateResponse = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                method: "PUT",
                headers: {
                    'Authorization': `Bearer ${ghToken}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: "Update Ludo Config",
                    content: btoa(configJsonStr), // Encode to base64
                    sha: sha,
                    branch: BRANCH
                })
            });

            if (updateResponse.ok) {
                status.innerText = "✅ Saved to GitHub! Now go to ludo.html and play.";
                status.style.color = "#4caf50";
            } else {
                const err = await updateResponse.text();
                status.innerText = "❌ Error: " + err;
                status.style.color = "#f44336";
            }

        } catch (error) {
            status.innerText = "Network Error: " + error.message;
        }
    });
</script>

</body>
</html>
