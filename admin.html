<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Secure Admin - Fixed</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #121212; color: #0f0; padding: 20px; }
        .box { background: #1e1e1e; padding: 20px; border-radius: 8px; max-width: 600px; margin: auto; border: 1px solid #333; }
        input { width: 95%; padding: 10px; margin: 10px 0; background: #000; border: 1px solid #444; color: #fff; }
        button { width: 100%; padding: 12px; background: #0056b3; color: #fff; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #004494; }
        #log { margin-top: 20px; height: 150px; overflow-y: scroll; border: 1px solid #333; background: #000; padding: 5px; font-size: 12px; }
        label { font-size: 12px; color: #aaa; }
    </style>
</head>
<body>

<div class="box">
    <h2>🔐 Ludo Secure Upload</h2>
    
    <label>GitHub Username (Owner):</label>
    <input type="text" id="ghUser" placeholder="e.g., talibmalla455">
    
    <label>Repository Name:</label>
    <input type="text" id="ghRepo" placeholder="e.g., ludo-backend">
    
    <label>GitHub PAT Token:</label>
    <input type="text" id="ghToken" placeholder="ghp_xxxxxxxxxxxxx">
    
    <label>Discord Bot Token (Will be Encoded):</label>
    <input type="text" id="dcToken" placeholder="Your Discord Token">
    
    <label>Channel ID:</label>
    <input type="text" id="channelId" placeholder="123456789">

    <button id="saveBtn">Encode & Upload to GitHub</button>
</div>

<div class="box">
    <h3>📝 Live Logs</h3>
    <div id="log"></div>
</div>

<script>
    // --- CONFIGURATION ---
    const ENCODE_KEY = "LUDO_SECURE_2026";

    function encodeData(token) {
        let encoded = [];
        for (let i = 0; i < token.length; i++) {
            let charCode = token.charCodeAt(i);
            let keyCode = ENCODE_KEY.charCodeAt(i % ENCODE_KEY.length);
            let newCode = charCode ^ keyCode;
            encoded.push(newCode.toString(16));
        }
        return encoded.join("-");
    }

    const logDiv = document.getElementById('log');
    function addLog(msg) {
        const div = document.createElement('div');
        div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        logDiv.prepend(div);
    }

    document.getElementById('saveBtn').addEventListener('click', async () => {
        const ghUser = document.getElementById('ghUser').value.trim();
        const ghRepo = document.getElementById('ghRepo').value.trim();
        const ghToken = document.getElementById('ghToken').value.trim();
        const dcToken = document.getElementById('dcToken').value.trim();
        const chId = document.getElementById('channelId').value.trim();

        if(!ghUser || !ghRepo || !ghToken || !dcToken) {
            addLog("❌ Please fill all fields including Repo Name!");
            return;
        }

        const url = `https://api.github.com/repos/${ghUser}/${ghRepo}/contents/config.json`;

        try {
            addLog(`Fetching path: https://github.com/${ghUser}/${ghRepo}/blob/main/config.json`);
            
            // 1. Check if file exists
            const res = await fetch(url, {
                headers: { 'Authorization': `token ${ghToken}` }
            });

            let sha = null;
            if (res.ok) {
                const data = await res.json();
                sha = data.sha;
                addLog("✅ Existing file found. Updating...");
            } else {
                addLog("⚠️ File not found. Creating new file...");
            }

            // 2. Encode and Prepare Payload
            const encodedToken = encodeData(dcToken);
            const payload = {
                token: encodedToken,
                channel: chId,
                type: "ludo_config"
            };
            
            const b64Content = btoa(JSON.stringify(payload));

            // 3. Upload
            addLog("Uploading to GitHub...");
            const res2 = await fetch(url, {
                method: 'PUT',
                headers: { 
                    'Authorization': `token ${ghToken}`, 
                    'Content-Type': 'application/json' 
                },
                body: JSON.stringify({
                    message: "Update config (Encoded)",
                    content: b64Content,
                    sha: sha // If sha is null, it creates new; if present, it updates
                })
            });

            const resData = await res2.json();
            
            if (res2.ok) {
                addLog("✅ Successfully Uploaded & Encoded!");
                addLog(`🔗 Live Preview: https://github.com/${ghUser}/${ghRepo}/blob/main/config.json`);
                testDiscord(ghToken, chId);
            } else {
                addLog(`❌ Upload Failed: ${resData.message}`);
            }

        } catch (e) {
            addLog(`❌ Network Error: ${e.message}`);
        }
    });

    function testDiscord(token, chId) {
        fetch(`https://discord.com/api/v10/channels/${chId}`, {
            headers: { 'Authorization': `Bot ${token}` }
        })
        .then(res => res.ok ? addLog("✅ Discord Connection Verified!") : addLog("❌ Discord Invalid"))
        .catch(() => addLog("❌ Network Error"));
    }
</script>

</body>
</html>
