<script>
    // Load saved config from LocalStorage
    window.onload = () => {
        if(localStorage.getItem('ghToken')) document.getElementById('githubToken').value = localStorage.getItem('ghToken');
        if(localStorage.getItem('dcToken')) document.getElementById('discordToken').value = localStorage.getItem('dcToken');
        if(localStorage.getItem('chId')) document.getElementById('channelId').value = localStorage.getItem('chId');
        
        // Auto-fetch logs if token exists
        if(localStorage.getItem('dcToken') && localStorage.getItem('chId')) {
            testConnection(localStorage.getItem('dcToken'), localStorage.getItem('chId'));
        }
    };

    document.getElementById('saveBtn').addEventListener('click', () => {
        const gh = document.getElementById('githubToken').value;
        const dc = document.getElementById('discordToken').value;
        const ch = document.getElementById('channelId').value;

        if(!gh || !dc || !ch) {
            alert("Please fill all fields!");
            return;
        }

        localStorage.setItem('ghToken', gh);
        localStorage.setItem('dcToken', dc);
        localStorage.setItem('chId', ch);

        addLog("Configuration Saved. Updating GitHub...");
        
        // Call the new update function
        updateGitHubConfig(gh, dc, ch);
    });

    async function updateGitHubConfig(token, discordToken, channelId) {
        const configData = {
            discordToken: discordToken,
            channelId: channelId,
            githubToken: token,
            lastUpdated: new Date().toISOString()
        };

        const fileName = 'config.json';
        const branch = 'main'; // Change to 'master' if your repo uses master
        const filePath = `/${fileName}`;

        try {
            // 1. Fetch the file to get its SHA
            addLog("Fetching existing file to get SHA...");
            const repoName = window.location.hostname.split('.')[0]; // Get repo name from URL
            const owner = window.location.hostname.split('.')[1]; // Get owner username from URL
            
            // Note: If you are hosting admin on a different domain, you need to hardcode owner/repo
            // For now, assuming admin is in the same repo as config.json
            
            const existingFileUrl = `https://api.github.com/repos/${owner}/${repoName}/contents/${fileName}`;
            
            let sha = null;
            let response = await fetch(existingFileUrl, {
                headers: { 'Authorization': `token ${token}` }
            });

            if (response.status === 200) {
                const data = await response.json();
                sha = data.sha;
                addLog(`✅ File found. SHA: ${sha.substring(0, 7)}...`);
            } else if (response.status === 404) {
                addLog("⚠️ File not found. Creating new file...");
                sha = null; // Create new
            } else {
                throw new Error(`Failed to fetch file: ${response.status}`);
            }

            // 2. Update or Create the file
            addLog("Uploading configuration to GitHub...");
            
            const payload = {
                message: "Update Ludo Config via Admin Panel",
                content: btoa(unescape(encodeURIComponent(JSON.stringify(configData)))),
                branch: branch,
                // If sha is null, it creates a new file. If sha exists, it updates.
                ...(sha && { sha: sha }) 
            };

            const updateUrl = `https://api.github.com/repos/${owner}/${repoName}/contents/${fileName}`;
            
            const updateResponse = await fetch(updateUrl, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            if (updateResponse.ok) {
                const result = await updateResponse.json();
                addLog(`✅ Success! File updated at: ${result.content.html_url}`);
                
                // Also update Discord connection now that config is saved
                testConnection(discordToken, channelId);
            } else {
                const errorData = await updateResponse.json();
                addLog(`❌ Error: ${errorData.message}`);
            }

        } catch (error) {
            addLog(`❌ Process Error: ${error.message}`);
        }
    }

    // Existing Discord Connection Logic
    function testConnection(token, channelId) {
        addLog("Testing Discord Connection...");
        fetch(`https://discord.com/api/v10/channels/${channelId}`, {
            headers: { 'Authorization': `Bot ${token}` }
        })
        .then(res => res.json())
        .then(data => {
            if(data.name) {
                addLog(`✅ Connected to Channel: ${data.name} (ID: ${channelId})`);
                fetchRecentMessages(token, channelId);
            } else {
                addLog("❌ Invalid Channel ID or Token.");
            }
        })
        .catch(err => {
            addLog("❌ Connection Error: " + err.message);
        });
    }

    function fetchRecentMessages(token, channelId) {
        fetch(`https://discord.com/api/v10/channels/${channelId}/messages?limit=10`, {
            headers: { 'Authorization': `Bot ${token}` }
        })
        .then(res => res.json())
        .then(messages => {
            messages.forEach(msg => {
                let time = new Date(msg.timestamp).toLocaleTimeString();
                let content = msg.content || "(Video Attachment)";
                addLog(`[${time}] User: ${msg.author.username} - ${content}`);
            });
        });
    }

    function addLog(message) {
        const logs = document.getElementById('logs');
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        const time = new Date().toLocaleTimeString();
        entry.innerHTML = `<span class="time">[${time}]</span> ${message}`;
        logs.prepend(entry);
    }
</script>
